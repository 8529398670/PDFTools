  top_label: "Top bar"
  sidebar_label: "Screens"
  # The browser tab, per screen. {screen} is the screen's heading.
  page_title: "{screen} · {app}"
  # Foot of the sidebar, for admins.
  version: "Version {version}"
  account: "Account"
  # Under the account's name in the sidebar, for a viewer: it can look at
  # everything and change nothing, and the controls that would are hidden.
  view_only: "View only"
  appearance: "Appearance"
  shortcuts: "Shortcuts"
